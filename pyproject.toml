[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-ai-notetaker"
version = "0.1.0"
description = "AI powered note taker from YouTube videos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.1",
    "opencv-python>=4.12.0.88",
    "rich>=14.2.0",
    "youtube-transcript-api>=1.2.3",
    "yt-dlp>=2025.12.8",
]

[project.scripts]
ytainotetaker = "youtube_ai_notetaker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_ai_notetaker"]
